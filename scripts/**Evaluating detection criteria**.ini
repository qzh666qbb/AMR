**Evaluating detection criteria**

I'm thinking about how to document the 10 accepted probabilities, especially since .6 feels low. The detector might not need all of them, but it definitely needs enough positive units to function effectively. It makes me wonder about the criteria based on a baseline detection requirement. I’m realizing that the diagnostics and injection scores are important too. Maybe we should set a minimum accepted score of 6 out of 10 for plausible detection, but right now it’s at 0. Testing is definitely necessary.

**Analyzing probability outcomes**

I'm pondering the implications of having 0 out of 8 accepted slots, which seems to hint at a possible upper probability bound of about 31.2%. However, it feels important to note that the attempts aren't truly independent. With 0 out of 400 attempts, it might suggest a candidate-level upper of around 0.75%, assuming independence. But then again, there's a correlation involved, and the selection schedule complicates things. Overall, it seems more like a diagnostic observation than a formal conclusion.


下一步不应直接重跑 20 篇。当前瓶颈已经明确：**不是篇章长度，而是注入命中率**。8 个槽、400 次候选全部未达到 0.75，先扩大样本只会继续烧调用。

**建议路线**

| 阶段 | 实验 | 目的 | 预注册通过条件 |
|---|---|---|---|
| D1 | 官方无上下文正对照，20 槽 | 验证当前模型和 SWAN 管线还能命中 | 接受率至少 40% |
| D2 | 配对上下文消融，16 个新 source × 4 条件 | 找出是哪类上下文破坏 S2Match | 至少一种方法接受率不低于正对照 15 个百分点 |
| D3 | 胜出方法生成 20 篇 × 10 槽 | 验证正常长度、连贯性和注入率能否同时成立 | 至少 12/20 结构合格，中位数至少 6/10 槽接受 |
| D4 | 双真人盲评 | 确认文章质量 | 完成后如实报告，不事后改门槛 |
| D5 | 基线检测 | 估计 TPR | 仅对质量合格 cohort 执行 |

D2 建议比较四种提示：

1. **无上下文**：官方 SWAN 正对照。
2. **完整语义上下文**：本轮失败方法。
3. **词汇锚定**：只提供 source 中的实体和主题名词，不要求复述事实。
4. **词汇锚定 + 最近一句**：兼顾主题和篇章连续性。

关键改动：

- 捕获 `amrlib.models.parse_xfm.penman_serializer` 的全部 warning。
- 已知 malformed-graph warning 只判当前候选无效，禁止进入 S2Match；未知 warning 全局停止。
- 每个条件使用相同 source、Bank50 模板和随机种子，做真正配对比较。
- D1/D2 使用全新来源，但先只生成单槽，不急着拼文章。
- 只有 D2 找到稳定方法后才投入完整 20 篇和真人评审。

说人话：**先证明水印本身还能打进去，再研究怎样让十句话连贯。** 目前直接生成长文章，顺序反了。
对，**如果当前目的只是验证“水印能否成功注入并被结构攻击破坏”**，连贯性不是必要条件。我之前把“可发表的自然文本质量”提前混进了注入实验，约束过多。

三个目的要分开：

1. **注入可行性**：只要求每句 `S2Match >= 0.75`，不接受 fallback，不要求句间连贯。
2. **结构漏洞验证**：把成功注入句组成固定长度文档，测原始 TPR，再做边界变换测下降。
3. **自然文本主张**：只有论文要声称“对真实、流畅文章也有效”时，才需要连贯性和真人盲评。

所以下一步最直接的实验应是：

- 使用官方无上下文注入；
- 每个槽最多 50 次；
- 只保留真正达到 0.75 的句子；
- 凑够固定数量的成功句后组成文档；
- 先测基线检测率，再做 count-neutral 边界攻击；
- 将结论严格写成“受控合成 SWAN-positive 文档上的结构性漏洞”。

这样更快，也更贴合当前研究目的。连贯性可以作为后续增强实验，而不是前置门槛。