我会按“研究问题 → 实验怎么做 → 做出了什么 → 能说明什么 → 不能说明什么”把整篇论文实验串起来，并以当前冻结结果为准，避免把探索性现象误写成正式结论。

**一句话概括**
我们研究的是：

> **SWAN 号称把水印藏在句子“语义”里，但它实际检测时依赖外部句子边界。那么，不改事实甚至不改词，只改变句子怎么切分，能不能让水印检测失效？**

这不是攻击 AMR 语义本身，而是在审计 **“语义水印”和“句级检测实现”之间是否存在接口漏洞**。

**一、SWAN 怎么工作**
SWAN 大致分五步：

1. 给每句话注入一个 AMR 语义模板。
2. 检测时先把文章切成 $N$ 个句子。
3. 每句话经过 AMR parser，得到候选语义图。
4. 候选图与固定 AMR-Bank 匹配，匹配成功记为 green。
5. 根据 green 数量 $G$ 和句子数 $N$ 计算：

$$
z=\frac{G-0.25N}{\sqrt{0.25(1-0.25)N}}
$$

所以，**句界不仅决定 parser 看见什么，还直接决定统计量里的 $N$。**

例如把五句话合成一句后，即使唯一一句仍然 green，也有：

$$
z_{\max}=\sqrt{3}=1.732<2.33
$$

也就是说，在默认严格阈值下，$N=1$ 时理论上就很难被判成有水印。

**二、为什么要研究它**
语义水印的卖点是：同义改写后，语义还在，水印应该仍然存在。

但如果只是移动句号、分号，事实、词汇和词序基本不变，检测结果就翻转，那么说明：

- 水印可能没有真正做到文档级语义稳定。
- 检测器过度依赖句子切分方式。
- 攻击者不必破坏语义，只需改变 parser 的输入跨度或统计单元。
- 论文评测不能只测试普通逐句复述，还必须测试拆句、合句和重分句。

**三、整个实验做了什么**

| 阶段 | 做了什么 | 结果与作用 |
|---|---|---|
| 历史攻击面 | 对250篇SWAN文本生成结构改写候选 | 固定4候选 Valid ASR `76.4%`；反馈补救后 `87.2%` |
| 独立三臂实验 | 比较普通复述、仅句界重组、完整Plan E | 无反馈成功率分别约 `6.7%`、`96.7%`、`33.3%` |
| 严格A-B-A | 五句原文→分号合成一句→恢复原五个跨度 | 逃逸 `1/30 → 30/30 → 1/30` |
| 机制诊断 | 分开研究parser输出、模板图和S2Match | 证明图作用域会影响匹配，但人工组合图不能代表真实自然文本因果机制 |
| 跨水印对照 | 把冻结句界方法用于KGW和SynthID-Text | Valid ASR为 `0/30` 和 `1/30`，没有证明通用迁移 |
| 防御探索 | 重新分句、局部多实例、relation motif等 | 只有缓解线索，没有得到可靠的分割无关防御 |
| 正常长度主实验 | 计划在100–220词、质量合格文本上保持句数不变，只交换句界位置 | 生成质量和结构门未通过，正式检测端点没有运行 |
| 单篇工程正例 | 定向生成126词、20句、20/20严格注入 | 证明技术上能生成正常长度可检测文档，但没有source anchoring和真人盲评 |
| Source-anchored V2 | 用全新新闻原文验证单句事实约束下能否注入target-47 | 最高S2Match `0.5625<0.75`，0/1通过，停止 |

**四、最关键的实验发现**
最强证据是严格标点 A-B-A：

- 原始五句话：只有 `1/30` 逃逸。
- 不改词和词序，只把句号换成分号：`30/30` 逃逸。
- 把原来的五个句子跨度交还检测器：恢复到 `1/30` 逃逸。

这说明检测结果确实依赖外部句界，而且是可逆的。

但它把 $N=5$ 降到了 $N=1$，所以还不能判断：

> 检测下降究竟只是句子数量减少造成的统计功效下降，还是 parser、模板图和S2Match也发生了额外变化？

为回答这个问题，我们设计了句数守恒实验：

- 一处把两个句子合并；
- 另一处把一个自然复句拆开；
- 保持总检测单元数 $N$ 不变；
- 再比较原文和攻击文本。

这才是论文原本最重要的正式主实验。

**五、为什么正式主实验没完成**
正式实验要求同时满足：

- 100–220词；
- 至少8个检测单元；
- 每个水印槽严格注入成功；
- 来源事实可追溯；
- 两名独立真人盲评；
- 质量标签在检测前冻结；
- 攻击前后 $N$ 相同；
- 每个条件独立校准FPR。

但生成阶段连续遇到问题：

- final1：8篇中6篇结构合格，但当前辅助质量标签为0/6。
- source-anchored pilot：只有5/8通过结构门，60个完成槽全部是fallback。
- 126词工程正例虽然20/20注入并20/20检出，但事实不是独立原文锚定。
- 最新单句V2修复了程序错误，但真实评分最高只有0.5625。

所以项目在检测攻击之前停止。不能把“未运行”写成“攻击失败”或“检测器稳健”。

**六、论文现在能得出什么结论**
可以说：

> 在30篇17–46词的短文本上，保持词汇和词序、只改变并恢复句界，可以可逆地改变SWAN最终判定。SWAN端到端检测对句子分割粒度存在明显依赖。

还可以说：

- 历史实验显示SWAN存在较大的实际结构改写攻击面。
- 句界操作明显强于普通复述。
- 生成正常长度、严格注入且质量合格的确认队列本身是困难的。
- 预注册停止避免了失败后换source、改门槛和事后挑结果。

**七、不能说什么**
目前不能声称：

- 已完成正常长度、句数守恒的攻击验证。
- 已证明攻击改变了“AMR语义”。
- 已证明parser变化、S2Match或统计量中的某一个是唯一原因。
- 已证明句界攻击能普遍清除所有文本水印。
- 已实现有效的分割无关防御。
- 已取得正式真人双盲质量结论或条件特异FPR结论。

**八、这篇论文真正的意义**
它的意义不是“我们发明了一个万能水印清除算法”，而是：

1. 揭示了语义水印实现中的一个系统接口风险：**句子语义不等于文档分割。**
2. 证明SWAN的最终检测不仅依赖语义，还依赖文本被怎样切成检测单元。
3. 说明水印论文只测逐句复述是不够的，必须加入重分句、固定 $N$ 和实际FPR评测。
4. 严格区分了行为漏洞、统计功效、parser变化和图匹配变化，避免把相关性写成因果。
5. 如实保留负结果和停止过程，形成一篇范围明确、可复现的SWAN系统审计。

所以目前最准确的论文定位是：

> **一篇关于SWAN句子分割依赖的范围受限系统审计，而不是一篇已经完成全部机制证明的通用水印攻击论文。**

